<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin — A's Collection</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: { cream: '#FAFAFA', burgundy: '#2A1215', gold: '#D4AF37', plum: '#5A2D82', midnight: '#0E0812' },
            boxShadow: { luxe: '0 18px 50px rgba(42, 18, 21, 0.18)' },
            fontFamily: { display: ['Georgia', 'serif'] },
          },
        },
      };
    </script>
    <style>
      body { font-family: 'Segoe UI', sans-serif; background: #fafafa; color: #2a1215; }
      .hidden { display: none !important; }
    </style>
  </head>
  <body class="min-h-screen">

    <!-- LOGIN SCREEN -->
    <div id="loginScreen" class="flex min-h-screen items-center justify-center p-6">
      <div class="w-full max-w-sm rounded-[28px] border border-[#efe3d4] bg-white p-8 shadow-luxe">
        <div class="mb-6 text-center">
          <div class="mx-auto mb-3 flex h-14 w-14 items-center justify-center rounded-full bg-[#2A1215] text-xl font-bold text-[#f7d77d]">A</div>
          <h1 class="font-display text-2xl text-[#2A1215]">Admin Access</h1>
          <p class="mt-1 text-sm text-[#8d7b6d]">Enter your admin key to continue</p>
        </div>
        <input id="adminKeyInput" type="password" placeholder="Admin key" class="w-full rounded-full border border-[#e7d8c7] px-4 py-3 text-sm outline-none focus:border-[#D4AF37]" />
        <p id="loginError" class="hidden mt-2 text-xs font-semibold text-red-600">Wrong admin key. Try again.</p>
        <button id="loginBtn" class="mt-4 w-full rounded-full bg-[#2A1215] px-4 py-3 text-sm font-semibold text-white">Unlock</button>
      </div>
    </div>

    <!-- DASHBOARD -->
    <div id="dashboard" class="hidden mx-auto max-w-3xl p-4 sm:p-8">
      <div class="mb-6 flex items-center justify-between">
        <h1 class="font-display text-2xl text-[#2A1215]">A's Collection — Admin</h1>
        <button id="logoutBtn" class="rounded-full border border-[#e7d8c7] bg-white px-4 py-2 text-xs font-semibold text-[#2A1215]">Log out</button>
      </div>

            <button id="addProductBtn" class="mb-6 w-full rounded-full bg-[#D4AF37] px-4 py-3 text-sm font-semibold text-[#2A1215] shadow-luxe">+ Add Product</button>

      <!-- THEME COLOR PICKER -->
      <div class="mb-6 rounded-[24px] border border-[#efe3d4] bg-white p-5 shadow-sm">
        <h2 class="mb-4 font-display text-xl text-[#2A1215]">Theme Colors</h2>
        <div class="space-y-3" id="themeFields">
          <div class="flex items-center justify-between gap-3">
            <label class="text-sm font-medium text-[#2A1215]">Primary (main dark brand color)</label>
            <div class="flex items-center gap-2">
              <input type="color" id="theme_primary" class="h-9 w-9 cursor-pointer rounded-lg border border-[#e7d8c7]" />
              <input type="text" id="theme_primary_hex" class="w-24 rounded-lg border border-[#e7d8c7] px-2 py-1 text-xs" />
            </div>
          </div>
          <div class="flex items-center justify-between gap-3">
            <label class="text-sm font-medium text-[#2A1215]">Accent (gold buttons/badges)</label>
            <div class="flex items-center gap-2">
              <input type="color" id="theme_accent" class="h-9 w-9 cursor-pointer rounded-lg border border-[#e7d8c7]" />
              <input type="text" id="theme_accent_hex" class="w-24 rounded-lg border border-[#e7d8c7] px-2 py-1 text-xs" />
            </div>
          </div>
          <div class="flex items-center justify-between gap-3">
            <label class="text-sm font-medium text-[#2A1215]">Background (page background)</label>
            <div class="flex items-center gap-2">
              <input type="color" id="theme_bg" class="h-9 w-9 cursor-pointer rounded-lg border border-[#e7d8c7]" />
              <input type="text" id="theme_bg_hex" class="w-24 rounded-lg border border-[#e7d8c7] px-2 py-1 text-xs" />
            </div>
          </div>
          <div class="flex items-center justify-between gap-3">
            <label class="text-sm font-medium text-[#2A1215]">Dark (modal / deep panels)</label>
            <div class="flex items-center gap-2">
              <input type="color" id="theme_dark" class="h-9 w-9 cursor-pointer rounded-lg border border-[#e7d8c7]" />
              <input type="text" id="theme_dark_hex" class="w-24 rounded-lg border border-[#e7d8c7] px-2 py-1 text-xs" />
            </div>
          </div>
          <div class="flex items-center justify-between gap-3">
            <label class="text-sm font-medium text-[#2A1215]">Secondary (plum accents/links)</label>
            <div class="flex items-center gap-2">
              <input type="color" id="theme_secondary" class="h-9 w-9 cursor-pointer rounded-lg border border-[#e7d8c7]" />
              <input type="text" id="theme_secondary_hex" class="w-24 rounded-lg border border-[#e7d8c7] px-2 py-1 text-xs" />
            </div>
          </div>
        </div>
        <button id="saveThemeBtn" class="mt-4 w-full rounded-full bg-[#2A1215] px-4 py-3 text-sm font-semibold text-white">Save Theme</button>
        <p id="themeSavedMsg" class="hidden mt-2 text-center text-xs font-semibold text-green-700">Saved! Refresh your storefront to see it live.</p>
      </div>
      <!-- ADD/EDIT FORM -->
      <div id="productForm" class="hidden mb-6 rounded-[24px] border border-[#efe3d4] bg-white p-5 shadow-sm">
        <h2 id="formTitle" class="mb-4 font-display text-xl text-[#2A1215]">Add Product</h2>
        <div class="space-y-3">
          <input id="f_name" placeholder="Product name" class="w-full rounded-xl border border-[#e7d8c7] px-3 py-2 text-sm" />
          <input id="f_category" placeholder="Category (e.g. Arabian Perfumes)" class="w-full rounded-xl border border-[#e7d8c7] px-3 py-2 text-sm" />
          <input id="f_badge" placeholder="Badge (e.g. New, Best Seller)" class="w-full rounded-xl border border-[#e7d8c7] px-3 py-2 text-sm" />
          <textarea id="f_description" placeholder="Description" rows="3" class="w-full rounded-xl border border-[#e7d8c7] px-3 py-2 text-sm"></textarea>
          <input id="f_image" placeholder="/images/filename.jpg" class="w-full rounded-xl border border-[#e7d8c7] px-3 py-2 text-sm" />
          <input id="f_price" type="number" placeholder="Price (₦)" class="w-full rounded-xl border border-[#e7d8c7] px-3 py-2 text-sm" />

          <div>
            <div class="mb-2 flex items-center justify-between">
              <span class="text-xs uppercase tracking-[0.15em] text-[#8d7b6d]">Variants (optional)</span>
              <button type="button" id="addVariantBtn" class="rounded-full bg-[#f5efe7] px-3 py-1 text-xs font-semibold text-[#2A1215]">+ Add variant</button>
            </div>
            <div id="variantRows"></div>
          </div>

          <div class="flex gap-3 pt-2">
            <button id="saveProductBtn" class="flex-1 rounded-full bg-[#2A1215] px-4 py-3 text-sm font-semibold text-white">Save</button>
            <button id="cancelFormBtn" class="rounded-full border border-[#e7d8c7] bg-white px-4 py-3 text-sm font-semibold text-[#2A1215]">Cancel</button>
          </div>
        </div>
      </div>

            <div id="productList" class="space-y-3"></div>

      <!-- DELIVERY DESTINATIONS -->
      <div class="mt-8 rounded-[24px] border border-[#efe3d4] bg-white p-5 shadow-sm">
        <h2 class="mb-4 font-display text-xl text-[#2A1215]">Delivery Destinations</h2>
        <div id="destinationRows" class="space-y-2"></div>
        <button id="addDestinationBtn" class="mt-3 rounded-full bg-[#f5efe7] px-3 py-1.5 text-xs font-semibold text-[#2A1215]">+ Add destination</button>
        <button id="saveDestinationsBtn" class="mt-4 w-full rounded-full bg-[#2A1215] px-4 py-3 text-sm font-semibold text-white">Save Destinations</button>
      </div>

      <!-- PROMO SETTINGS -->
      <div class="mt-8 rounded-[24px] border border-[#efe3d4] bg-white p-5 shadow-sm">
        <h2 class="mb-4 font-display text-xl text-[#2A1215]">Promo / Sale</h2>
        <div class="space-y-3">
          <label class="flex items-center gap-2 text-sm font-medium text-[#2A1215]">
            <input type="checkbox" id="promo_enabled" class="h-5 w-5" /> Promo enabled
          </label>
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="mb-1 block text-xs text-[#8d7b6d]">Start date</label>
              <input type="date" id="promo_start" class="w-full rounded-xl border border-[#e7d8c7] px-3 py-2 text-sm" />
            </div>
            <div>
              <label class="mb-1 block text-xs text-[#8d7b6d]">End date</label>
              <input type="date" id="promo_end" class="w-full rounded-xl border border-[#e7d8c7] px-3 py-2 text-sm" />
            </div>
          </div>
          <div class="grid grid-cols-3 gap-3">
            <div>
              <label class="mb-1 block text-xs text-[#8d7b6d]">Standard %</label>
              <input type="number" id="promo_standard" class="w-full rounded-xl border border-[#e7d8c7] px-3 py-2 text-sm" />
            </div>
            <div>
              <label class="mb-1 block text-xs text-[#8d7b6d]">Bulk %</label>
              <input type="number" id="promo_bulk" class="w-full rounded-xl border border-[#e7d8c7] px-3 py-2 text-sm" />
            </div>
            <div>
              <label class="mb-1 block text-xs text-[#8d7b6d]">Bulk over (₦)</label>
              <input type="number" id="promo_threshold" class="w-full rounded-xl border border-[#e7d8c7] px-3 py-2 text-sm" />
            </div>
          </div>
        </div>
        <button id="savePromoBtn" class="mt-4 w-full rounded-full bg-[#2A1215] px-4 py-3 text-sm font-semibold text-white">Save Promo</button>
        <p id="promoSavedMsg" class="hidden mt-2 text-center text-xs font-semibold text-green-700">Saved!</p>
      </div>
    </div>

    <script src="admin-app.js"></script>
  </body>
</html>
